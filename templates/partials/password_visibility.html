<style>
  .password-field-wrap { position:relative; display:flex; width:100%; min-width:0; }
  .password-field-wrap > input[type="password"],
  .password-field-wrap > input[type="text"] { width:100%; min-width:0; padding-right:64px; }
  .password-field-toggle,
  .patient-auth-form .password-field-toggle,
  .patient-profile-form .password-field-toggle {
    position:absolute; top:50%; right:8px; z-index:1; transform:translateY(-50%);
    display:inline-flex; align-items:center; justify-content:center; width:auto; min-width:44px; min-height:32px;
    margin:0; padding:5px 8px; border:0; border-radius:7px; background:transparent;
    box-shadow:none; color:#087b85; font:600 12px/1 Inter,Arial,sans-serif; cursor:pointer;
  }
  .password-field-toggle:hover { background:#eaf5f4; color:#075f69; }
  .password-field-toggle:focus-visible { outline:2px solid #087b85; outline-offset:1px; }
  .password-field-toggle:disabled { cursor:not-allowed; opacity:.6; }
</style>
<script>
  (() => {
    const fields = document.querySelectorAll('input[type="password"]');
    fields.forEach((input, index) => {
      if (input.dataset.visibilityControl === 'ready') return;
      input.dataset.visibilityControl = 'ready';
      if (!input.id) input.id = `password-field-${index + 1}`;

      const wrapper = document.createElement('span');
      wrapper.className = 'password-field-wrap';
      input.parentNode.insertBefore(wrapper, input);
      wrapper.appendChild(input);

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'password-field-toggle';
      button.textContent = 'Show';
      button.setAttribute('aria-controls', input.id);
      button.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-label', 'Show password');
      button.addEventListener('click', () => {
        const reveal = input.type === 'password';
        input.type = reveal ? 'text' : 'password';
        button.textContent = reveal ? 'Hide' : 'Show';
        button.setAttribute('aria-pressed', String(reveal));
        button.setAttribute('aria-label', `${reveal ? 'Hide' : 'Show'} password`);
        input.focus({ preventScroll: true });
      });
      wrapper.appendChild(button);
    });
  })();
</script>
